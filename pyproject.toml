[project]
name = "sdr-toolkit"
version = "0.12.3"
description = "Decoders for amateur and utility radio data modes, fed by any audio playing on an Ubuntu or Windows desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyqt6>=6.7",
    "pillow>=10",
    "cryptography>=41",
    "sgp4>=2.23",
    "soundcard>=0.4.6; sys_platform == 'win32'",   # WASAPI loopback capture and playback
]

[project.scripts]
sdr-toolkit = "sdr_toolkit.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.13.0"]
build-backend = "uv_build"
